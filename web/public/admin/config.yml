# Decap CMS config for the We Present content portal (spec §9.2).
#
# All folder/media paths below are relative to the GIT REPO ROOT, which is
# `/Users/test/Downloads/We Present` (one level above this `web/` Next.js app) —
# not to this config file's own location. See web/CLAUDE.md "Content portal" for
# the full explanation, local testing steps, and what's still needed for
# production (a real OAuth backend once hosting is finalized).

backend:
  name: github
  repo: shhafuuu/we-present-website
  branch: main

# Lets the CMS run fully locally against the real repo files with no OAuth setup,
# via `npx decap-server` run from the repo root alongside `npm run dev`. Decap
# detects it's on localhost and talks to that proxy instead of the GitHub API.
# Harmless to leave in for production too — it's simply unused unless the proxy
# is actually running.
local_backend: true

publish_mode: simple

media_folder: "web/public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "tours"
    label: "Tours"
    label_singular: "Tour"
    folder: "web/content/tours"
    extension: "json"
    format: "json"
    create: true
    delete: true
    identifier_field: slug
    summary: "{{year}} · {{fields.name.en}} ({{status}})"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe id, e.g. maldives-tour-1. Must be unique. Do not change once a tour has a public detail page — its URL depends on this."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first in the calendar. Existing tours are 1–5; use 6+ for a new one, or a decimal (e.g. 1.5) to slot between two."
      - label: "Year label"
        name: "year"
        widget: "string"
        hint: "e.g. 2026 — or 2026 / 27 for a tour that spans years and should get its own calendar grouping."
      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Format"
        name: "format"
        widget: "select"
        required: false
        default: "tour"
        options:
          - { label: "Tour — travels to a destination, has a resort line-up and an itinerary", value: "tour" }
          - { label: "Workshop — a partner event held in one city, no destination or itinerary", value: "workshop" }
        hint: "Leave as Tour unless you are adding an event like the We Present Workshop. A Workshop uses Location, Note for agents and Still to be announced below, and ignores Destination, Itinerary stops, Properties and Programme PDF. Decap cannot hide fields it does not need, so those stay visible: leave them empty."
      - label: "Destination"
        name: "destination"
        widget: "object"
        required: false
        hint: "Tours only. Leave blank for a Workshop, which is held in a city rather than at a destination."
        fields:
          - { label: "English", name: "en", widget: "string", required: false }
          - { label: "Russian", name: "ru", widget: "string", required: false }
      - label: "Location (city)"
        name: "location"
        widget: "object"
        required: false
        hint: "Workshops only. The city, e.g. Moscow. It takes the place of the resort line-up on the calendar card."
        fields:
          - { label: "English", name: "en", widget: "string", required: false }
          - { label: "Russian", name: "ru", widget: "string", required: false }
      - label: "Dates (display text)"
        name: "dates"
        widget: "object"
        hint: "Free text, not a real date picker — e.g. \"17–23 August 2026\" or \"Dates to be confirmed\"."
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Confirmed — gets its own public tour-detail page", value: "confirmed" }
          - { label: "Pending — shows as \"coming soon\" on the calendar, no detail page yet", value: "pending" }
      - label: "Summary"
        name: "summary"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Russian", name: "ru", widget: "text" }
      - label: "Note for agents"
        name: "agentsNote"
        widget: "object"
        required: false
        hint: "Workshops only. Attendance terms for travel agents, e.g. that the event is complimentary. One line: it renders large, as the lead statement on the page."
        fields:
          - { label: "English", name: "en", widget: "text", required: false }
          - { label: "Russian", name: "ru", widget: "text", required: false }
      - label: "Still to be announced"
        name: "comingSoonNote"
        widget: "object"
        required: false
        hint: "Workshops only. What is not yet settled, e.g. exact dates, venue and programme. Say plainly what is coming rather than inventing a placeholder for it."
        fields:
          - { label: "English", name: "en", widget: "text", required: false }
          - { label: "Russian", name: "ru", widget: "text", required: false }
      - label: "TTM overview"
        name: "ttmOverview"
        widget: "object"
        required: false
        hint: "Only for a tour that Travel Trade Maldives runs alongside. It renders as its own section above the itinerary, labelled Optional, because TTM is not part of the tour and a row inside the dated itinerary would read as included. Leave both fields blank for every other tour."
        fields:
          - { label: "English", name: "en", widget: "text", required: false }
          - { label: "Russian", name: "ru", widget: "text", required: false }
      - label: "Properties (line-up without dates)"
        name: "properties"
        widget: "list"
        required: false
        summary: "{{fields.name}}"
        hint: "Use for a programme whose hotels are confirmed but whose dates are not, such as Cinnamon. Adding at least one property here gives the tour its own page even while it is Pending. Leave empty for a tour that uses Itinerary stops instead."
        fields:
          - { label: "Property name", name: "name", widget: "string" }
          - label: "Star tier"
            name: "tier"
            widget: "select"
            required: false
            options:
              - { label: "5 star", value: "5" }
              - { label: "4 star", value: "4" }
            hint: "Properties are grouped by tier under their own subheading. Do not mix ratings into one list."
          - label: "Badge"
            name: "badge"
            widget: "object"
            required: false
            hint: "Short flag such as \"Adults only, 18+\". Keep it to a few words: it renders as a small badge, not body copy."
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Russian", name: "ru", widget: "string", required: false }
          - label: "Short description"
            name: "description"
            widget: "object"
            required: false
            hint: "Optional. Leave blank until the copy is written; an empty description renders nothing."
            fields:
              - { label: "English", name: "en", widget: "text", required: false }
              - { label: "Russian", name: "ru", widget: "text", required: false }
      - label: "Programme PDF"
        name: "programmePdf"
        widget: "list"
        required: false
        summary: "{{fields.file}}"
        hint: "Gated download: visitors give a name and email before the file is sent, so every download becomes a lead. Upload the file to private/programme-pdfs/ in the repo, then enter its exact filename here. Add one entry per language. A tour with no entry, or whose file is missing, shows no download block at all."
        fields:
          - { label: "Filename", name: "file", widget: "string", hint: "Exact filename as it appears in private/programme-pdfs/, e.g. cinnamon-maldives-ru.pdf. Not a path." }
          - label: "Language"
            name: "locale"
            widget: "select"
            options:
              - { label: "Russian", value: "ru" }
              - { label: "English", value: "en" }
          - label: "Label"
            name: "label"
            widget: "object"
            hint: "Shown in the version picker when a tour has more than one file."
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
      - label: "Itinerary stops"
        name: "stops"
        widget: "list"
        allow_add: true
        required: false
        hint: "Tours only. Leave empty for a pending/coming-soon tour, and for any Workshop: a workshop has no dated itinerary."
        fields:
          - { label: "Stop name", name: "label", widget: "string" }
          - label: "Dates"
            name: "dates"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Note"
            name: "note"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Resort page to link to"
            name: "resortSlug"
            widget: "string"
            required: false
            hint: "Must exactly match a resort's Slug field (see the Resorts collection), e.g. fushifaru. Leave blank for a stop that has no resort page. Do not add an optional event such as TTM as a stop: the itinerary is a dated sequence, so anything listed here reads as part of the tour. Use the TTM overview field instead."
  - name: "destinations"
    label: "Destinations"
    label_singular: "Destination"
    folder: "web/content/destinations"
    extension: "json"
    format: "json"
    create: true
    delete: false
    identifier_field: slug
    summary: "{{fields.name.en}} ({{status}})"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe id, e.g. oman. Must be unique. Do not change once published — the destination page URL and every resort's Destination field depend on this."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first on the Destinations landing page."
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Active — gets its own public destination page", value: "active" }
          - { label: "Coming soon — shows as a non-clickable card, no page yet", value: "coming-soon" }
        hint: "Only switch to Active once this destination has at least one resort (see the Resorts collection's Destination field) and the Hero image / Intro below are filled in."
      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Programme type"
        name: "programmeType"
        widget: "select"
        required: false
        default: "hotels"
        options:
          - { label: "Hotels — we represent individual partner properties (Maldives)", value: "hotels" }
          - { label: "Destination — we represent the destination as a whole (Oman)", value: "destination" }
          - { label: "Lodge collection — we represent a collection (Kenya)", value: "collection" }
        hint: "Decides what this destination's page shows. Only \"Hotels\" renders a resort grid; the other two never will, so no empty grid appears."
      - label: "Lodge collection"
        name: "collection"
        widget: "object"
        required: false
        hint: "Only for Programme type \"Lodge collection\". Leave the lodge list empty until the client supplies the roster; never invent lodge names."
        fields:
          - { label: "Collection name", name: "name", widget: "string", required: false }
          - label: "Description"
            name: "description"
            widget: "object"
            required: false
            fields:
              - { label: "English", name: "en", widget: "text", required: false }
              - { label: "Russian", name: "ru", widget: "text", required: false }
          - label: "Lodges"
            name: "lodges"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            hint: "Name only, plus an optional image. No logos are available for these, so there is no logo field."
            fields:
              - { label: "Lodge name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Hero image", name: "heroImage", widget: "image", required: false, hint: "Required before switching Status to Active." }
      - label: "Intro"
        name: "intro"
        widget: "object"
        required: false
        hint: "Required before switching Status to Active."
        fields:
          - label: "Kicker (small label above the heading)"
            name: "kicker"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Body"
            name: "body"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Russian", name: "ru", widget: "text" }

  - name: "resorts"
    label: "Resorts"
    label_singular: "Resort"
    folder: "web/content/resorts"
    extension: "json"
    format: "json"
    create: true
    delete: false
    identifier_field: slug
    summary: "{{name}}"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe id, e.g. fushifaru. Must be unique. Do not change once published — every resort page URL and tour stop reference depends on this."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first in the resort grid and partners list."
      - label: "Destination"
        name: "destinationSlug"
        widget: "select"
        options:
          - { label: "Maldives", value: "maldives" }
          - { label: "Oman", value: "oman" }
          - { label: "Kenya", value: "kenya" }
        hint: "Which destination page this resort is nested under. Must match a Destinations collection entry's Slug."
      - { label: "Resort name", name: "name", widget: "string", hint: "Not translated — brand names stay as-is in both languages." }
      - label: "Atoll"
        name: "atoll"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Tagline"
        name: "tagline"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - { label: "Card image", name: "cardImage", widget: "image", hint: "Used in grid/list cards. Upload a new one here, or type a path under /images/resorts/<slug>/ if it's already been added to the repo by hand (see web/CLAUDE.md — the curated-image pipeline)." }
      - { label: "Card image alt text", name: "cardImageAlt", widget: "string", hint: "Describe the scene for screen readers, e.g. \"Aerial view of ... overwater villas\" — don't just repeat the resort name." }
      - { label: "Hero image", name: "heroImage", widget: "image" }
      - { label: "Hero video (optional)", name: "heroVideo", widget: "string", required: false, hint: "Path under /videos/, e.g. /videos/fushifaru-hero.mp4. Leave blank to show the hero image only." }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Official website", name: "website", widget: "string", required: false, hint: "Full URL incl. https:// — makes this resort's logo clickable on the Partners page and homepage. Leave blank until the hotel provides one." }
      - label: "Logo background treatment"
        name: "logoBg"
        widget: "select"
        options:
          - { label: "None — logo already looks right on a light background", value: "none" }
          - { label: "Dark — logo is light-colored and needs a dark chip behind it to be visible", value: "dark" }
      - { label: "Published (uncheck to hide from the site without deleting it)", name: "built", widget: "boolean", default: true }
      - label: "Stay dates (display text)"
        name: "stayDates"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Story paragraphs"
        name: "story"
        widget: "object"
        hint: "Each language needs the same number of paragraphs, in the same order."
        fields:
          - { label: "English paragraphs", name: "en", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - { label: "Russian paragraphs", name: "ru", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
      - label: "Key facts"
        name: "keyFacts"
        widget: "object"
        fields:
          - label: "Location"
            name: "location"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Villas"
            name: "villas"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Facilities"
            name: "facilities"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string", hint: "Describe what's in the photo — used by screen readers, not shown visually." }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "home"
        label: "Home Page"
        file: "web/content/settings/home.json"
        fields:
          - label: "Intro section"
            name: "intro"
            widget: "object"
            hint: "The \"What Is We Present\" block near the top of the homepage."
            fields:
              - label: "Kicker (small label above the text)"
                name: "kicker"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Russian", name: "ru", widget: "string" }
              - label: "Body text"
                name: "body"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Russian", name: "ru", widget: "text" }

      - name: "cases"
        label: "Cases — Stat Rail & Attribution"
        file: "web/content/settings/cases.json"
        fields:
          - label: "Attribution line"
            name: "attribution"
            widget: "object"
            hint: "Shown under the case index and on every case page. These are COATI results, not We Present results, and the wording is agreed with the client. Do not reword without asking."
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
          - label: "Stat rail"
            name: "stats"
            widget: "list"
            max: 3
            summary: "{{fields.value}}"
            hint: "Exactly three figures. Beyond three each number loses impact, and only the first three render."
            fields:
              - { label: "Value", name: "value", widget: "string", hint: "e.g. 19,854 or 15,000+. Digits animate on scroll; any prefix or suffix stays put." }
              - label: "Label"
                name: "label"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Russian", name: "ru", widget: "string" }
      - name: "tours"
        label: "Tours Page — What's Included / On-Site Programme"
        file: "web/content/settings/tours.json"
        fields:
          - label: "What's included"
            name: "included"
            widget: "object"
            hint: "The participation-package row (accommodation, dining, transfers, programme), shown once on the tours overview page. It states the category of what is covered; per-tour specifics belong in that tour's programme PDF, not here."
            fields:
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.label.en}}"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options:
                      - { label: "Ticket (registration / fee)", value: "ticket" }
                      - { label: "Bed (accommodation)", value: "bed" }
                      - { label: "Dining (board / all-inclusive)", value: "dining" }
                      - { label: "Transfer (car)", value: "transfer" }
                      - { label: "Programme (person + star)", value: "program" }
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Russian", name: "ru", widget: "string" }
                  - label: "Show this item"
                    name: "enabled"
                    widget: "boolean"
                    default: true
                    required: false
                    hint: "Switch off to hide an item without deleting it. The registration fee is off by default; switch it on if a future edition charges one."
              - label: "Fine print"
                name: "notes"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Russian", name: "ru", widget: "text" }
          - label: "On-site programme"
            name: "onSiteProgram"
            widget: "object"
            hint: "The \"on every programme you will enjoy\" list, shown once on the tours overview page and shared by every programme."
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                hint: "Keep this destination-neutral. It sits above every programme including Oman and Kenya, which have no hotels, so wording tied to hotels or resorts will not travel."
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Russian", name: "ru", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.en}}"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Russian", name: "ru", widget: "string" }

  - name: "cases"
    label: "Cases — COATI Results"
    label_singular: "Case"
    folder: "web/content/cases"
    extension: "json"
    format: "json"
    create: true
    delete: true
    identifier_field: slug
    summary: "{{fields.partner.en}}"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL segment, lowercase with hyphens, e.g. cinnamon-maldives. Changing it changes the case's web address."
      - label: "Display order"
        name: "order"
        widget: "number"
        value_type: "int"
        hint: "Lower numbers appear first in the index."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["sales", "media", "influencers", "events", "digital", "awards"]
        hint: "Drives which filter the case appears under."
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        required: false
        hint: "Switch off to hold a finished case back while a permission question is open. Oman is off pending confirmation that the ministry representation may be published."
      - label: "Feature this case"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "The first featured case gets the large card. Others get the dark fill but normal size."
      - label: "Partner"
        name: "partner"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Headline figure"
        name: "headlineMetric"
        widget: "object"
        required: false
        hint: "The single number the index card leads with. Leave empty for a case with no figure, such as an award; the card falls back to the summary."
        fields:
          - { label: "Value", name: "value", widget: "string", hint: "e.g. 19,854 or +98%" }
          - label: "Label"
            name: "label"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
      - label: "Summary"
        name: "summary"
        widget: "object"
        hint: "One line, shown on the index card."
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Russian", name: "ru", widget: "text" }
      - label: "Description"
        name: "description"
        widget: "object"
        required: false
        hint: "Detail-page opener. A case with no description gets no detail page and is not linked from the index, so never leave this half-written."
        fields:
          - { label: "English", name: "en", widget: "text", required: false }
          - { label: "Russian", name: "ru", widget: "text", required: false }
      - label: "What we did"
        name: "activities"
        widget: "list"
        required: false
        summary: "{{fields.en}}"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "The result"
        name: "results"
        widget: "list"
        required: false
        summary: "{{fields.en}}"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Russian", name: "ru", widget: "string" }
      - label: "Partner quote"
        name: "quote"
        widget: "object"
        required: false
        hint: "Paraphrase partner correspondence, never quote it verbatim. The source material is private email. Say so in the attribution."
        fields:
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
